<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uniframe icons</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 32px 16px; font: 14px/1.4 Inter, system-ui, sans-serif; color: #233A34; background: #EEF1EE; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 24px; color: #55645E; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-width: 1100px; }
  .cell { background: #fff; border-radius: 12px; padding: 20px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cell.dark { background: #233A34; color: #F4F1EA; }
  .cell svg { width: 48px; height: 48px; fill: currentColor; }
  .cell small { display: flex; gap: 10px; align-items: center; } .cell small svg { width: 20px; height: 20px; }
  .logo { width: 48px; height: 48px; }
</style>
</head>
<body>
<h1>Uniframe icons</h1>
<p>Drawn like the logo: solid 4-unit bars on a 24 grid, square ends, one rounded corner per icon. Shown at 48 and 20 px. The logo is first for comparison.</p>
<div class="grid" id="g"></div>
<script src="js/icons.js"></script>
<script>
  const logo = '<svg class="logo" viewBox="0 0 100 100"><path d="M0 0H36V18H18V82H68A14 14 0 0 0 82 68V18H64V0H100V68A32 32 0 0 1 68 100H0Z"/></svg>';
  const cells = [`<div class="cell">${logo}<small>logo</small></div>`];
  for (const k of Object.keys(UF_ICONS)) for (const dark of [false, true]) if (!dark || ['today','projects','quotes','calc'].includes(k) || true)
    cells.push(`<div class="cell ${dark ? 'dark' : ''}">${ufIcon(k)}<small>${ufIcon(k)}${k}</small></div>`);
  document.getElementById('g').innerHTML = cells.join('');
</script>
</body>
</html>
