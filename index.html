<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="uf-app">
  <nav class="uf-sidebar" aria-label="Main">
    <a class="uf-sidebar__logo" href="#/today">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path fill="#D3DEDB" d="M0 0H36V18H18V82H68A14 14 0 0 0 82 68V18H64V0H100V68A32 32 0 0 1 68 100H0Z"/></svg>
      <span>Uniframe<br>Systems</span>
    </a>
    <div id="nav" style="display:contents"></div>
  </nav>
  <div class="shell">
    <header class="uf-topbar">
      <form class="search" id="search" role="search">
        <svg class="uf-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M3 3H21V12A6 6 0 0 1 15 18H10L5 22V18H3ZM7 7V14H15A2 2 0 0 0 17 12V7Z"/></svg>
        <label class="sr" for="q">Search or ask the portal</label>
        <input id="q" name="q" placeholder="Search or ask: “open quotes for Wallsz”" autocomplete="off">
      </form>
      <span style="flex:1"></span>
      <button class="who" type="button" data-whomenu aria-label="Your account: Arjan Laninga"><span>Arjan Laninga</span><b aria-hidden="true">AL</b></button>
    </header>
    <main class="uf-main" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="uf-panel" id="panel" hidden aria-labelledby="pt" role="dialog"></aside>
<div id="modal" hidden></div>
<div class="uf-toast" id="toast" role="status" hidden></div>

<script src="js/icons.js?v=2"></script>

<script src="js/mail.js?v=6"></script>
